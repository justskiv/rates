# Checks of the rates job. Runs on pushes to main and on pull requests with
# a read-only token; it never publishes (rates-publish.yml does, on a
# schedule). A rates-v* tag, which only the owner can create, additionally
# builds the linux/amd64 binary and attaches it with its sha256 to a release.
name: ci

on:
  push:
    branches: [main]
    tags: ["rates-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: tidy
        run: go mod tidy -diff

      - name: vet
        run: go vet ./...

      # Includes contracts/ integrity (SHA256SUMS) and the schema checks.
      - name: test
        run: go test -race ./...

      - name: lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 fmt --diff ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: fuzz smoke
        run: |
          for t in FuzzFrankfurter FuzzFawaz FuzzERAPI; do
            go test ./internal/source -run '^$' -fuzz "^${t}\$" -fuzztime 30s
          done
          go test ./internal/merge -run '^$' -fuzz '^FuzzMerge$' -fuzztime 30s

      - name: push script
        run: bash deploy/push_test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/rates-v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release for this tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          TAG: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags "-s -w -X main._version=${TAG}+${GITHUB_SHA::7}" \
            -o "ratesjob-${TAG}-linux-amd64" ./cmd/ratesjob
          sha256sum "ratesjob-${TAG}-linux-amd64" >"ratesjob-${TAG}-linux-amd64.sha256"

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            "ratesjob-${TAG}-linux-amd64" "ratesjob-${TAG}-linux-amd64.sha256"
